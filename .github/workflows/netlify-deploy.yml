name: Trigger Netlify Deploy

on:
  push:
    branches:
      - main

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Deploy Hook
        env:
          HOOK_URL: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "NETLIFY_DEPLOY_HOOK is empty" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST -d '{}' "$HOOK_URL"
          echo "Deploy hook accepted (HTTP 2xx). This does not confirm the build finished."
